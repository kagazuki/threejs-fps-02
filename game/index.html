<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Depot 7: Tactical Three.js FPS</title>
<style>
  :root {
    --canvas: #14161a;
    --surface: #1e2228;
    --hairline: #2c323a;
    --ink: #e9e6df;
    --muted: #98a0a8;
    --accent: #f0a830;
    --ct-blue: #3a86ff;
    --t-red: #ff0054;
    --radius-panel: 4px;
    --radius-control: 8px;
    --font-ui: system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-readout: ui-monospace, 'SF Mono', Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--canvas);
    color: var(--ink);
    font-family: var(--font-ui);
  }
  #game, #game canvas { position: fixed; inset: 0; display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; }

  /* Match Top Bar */
  #match-bar {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 20px;
    background: color-mix(in srgb, var(--surface) 85%, transparent);
    border: 1px solid var(--hairline);
    padding: 8px 24px;
    border-radius: var(--radius-panel);
    font-family: var(--font-readout);
  }
  .team-ct, .team-t { display: flex; align-items: center; gap: 10px; }
  .team-label { font-weight: 700; font-size: 14px; }
  .team-ct .team-label { color: var(--ct-blue); }
  .team-t .team-label { color: var(--t-red); }
  .team-score { font-size: 24px; font-weight: 700; }
  .roster-dots { display: flex; gap: 5px; }
  .roster-dots i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .team-ct .roster-dots i.alive { background: var(--ct-blue); }
  .team-t .roster-dots i.alive { background: var(--t-red); }
  .roster-dots i.dead { background: var(--hairline); opacity: 0.5; }

  #timer-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 12px;
    border-left: 1px solid var(--hairline);
    border-right: 1px solid var(--hairline);
  }
  #round-timer { font-size: 20px; font-weight: 700; color: var(--ink); }
  #phase-badge { font-size: 10px; color: var(--accent); letter-spacing: 0.1em; }

  /* Bottom Left Vitals */
  #vitals {
    position: fixed;
    left: 28px;
    bottom: 24px;
    display: flex;
    gap: 24px;
    font-family: var(--font-readout);
  }
  .vital-item { display: flex; align-items: baseline; gap: 6px; font-size: 32px; font-weight: 700; }
  .vital-icon { font-size: 18px; color: var(--accent); }

  /* Bottom Right Ammo & Weapon */
  #weapon-badge {
    position: fixed;
    right: 28px;
    bottom: 80px;
    font-family: var(--font-readout);
    font-size: 14px;
    color: var(--muted);
    text-align: right;
  }
  #ammo {
    position: fixed;
    right: 28px;
    bottom: 24px;
    display: flex;
    align-items: baseline;
    gap: 8px;
    font-family: var(--font-readout);
    font-size: 52px;
    line-height: 1;
    color: var(--ink);
  }
  #ammo-reserve { font-size: 18px; color: var(--muted); }

  /* Killfeed */
  #killfeed {
    position: fixed;
    top: 20px;
    right: 20px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-family: var(--font-readout);
    font-size: 12px;
  }
  .kill-row {
    background: color-mix(in srgb, var(--surface) 90%, transparent);
    border: 1px solid var(--hairline);
    padding: 4px 10px;
    border-radius: 3px;
  }
  .kill-row .killer { color: var(--ct-blue); font-weight: bold; }
  .kill-row .victim { color: var(--t-red); font-weight: bold; }
  .kill-row .weapon { color: var(--muted); margin: 0 4px; }
  .kill-row .headshot { color: var(--accent); }

  /* Round Banner */
  #round-banner {
    position: fixed;
    top: 30%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    background: color-mix(in srgb, var(--surface) 95%, transparent);
    border: 2px solid var(--accent);
    padding: 24px 48px;
    border-radius: var(--radius-panel);
    transition: opacity 200ms ease;
  }
  #round-banner.hidden { opacity: 0; pointer-events: none; }
  #round-banner h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: 0.05em; }
  #round-banner p { margin: 0; font-size: 15px; color: var(--muted); }
  #round-banner.win h1 { color: var(--ct-blue); }
  #round-banner.lose h1 { color: var(--t-red); }

  /* Buy Menu */
  #buy-menu {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background: rgba(10, 12, 16, 0.85);
    z-index: 100;
  }
  #buy-menu.hidden { display: none; }
  .buy-panel {
    background: var(--surface);
    border: 1px solid var(--hairline);
    padding: 32px;
    border-radius: var(--radius-panel);
    width: 480px;
  }
  .buy-panel h2 { margin: 0 0 20px; font-size: 18px; color: var(--accent); letter-spacing: 0.05em; }
  .buy-grid { display: flex; flex-direction: column; gap: 10px; }
  .buy-card {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 14px;
    background: var(--canvas);
    border: 1px solid var(--hairline);
    border-radius: 4px;
    font-family: var(--font-readout);
    font-size: 14px;
  }
  .buy-card kbd {
    background: var(--hairline);
    padding: 2px 6px;
    border-radius: 3px;
    margin-right: 8px;
    color: var(--accent);
  }

  /* Crosshair & Hitmarker */
  #crosshair { position: fixed; left: 50%; top: 50%; width: 22px; height: 22px; transform: translate(-50%, -50%); }
  #crosshair i { position: absolute; background: var(--ink); opacity: .85; }
  #crosshair i:nth-child(1) { left: 10px; top: 0; width: 2px; height: 7px; }
  #crosshair i:nth-child(2) { left: 10px; bottom: 0; width: 2px; height: 7px; }
  #crosshair i:nth-child(3) { top: 10px; left: 0; height: 2px; width: 7px; }
  #crosshair i:nth-child(4) { top: 10px; right: 0; height: 2px; width: 7px; }

  #hitmarker { position: fixed; left: 50%; top: 50%; width: 26px; height: 26px; transform: translate(-50%, -50%) rotate(45deg); opacity: 0; transition: opacity 80ms linear; }
  #hitmarker.on { opacity: 1; }
  #hitmarker i { position: absolute; background: var(--accent); }
  #hitmarker.headshot i { background: #ff0054; }
  #hitmarker i:nth-child(1) { left: 12px; top: 0; width: 2px; height: 8px; }
  #hitmarker i:nth-child(2) { left: 12px; bottom: 0; width: 2px; height: 8px; }
  #hitmarker i:nth-child(3) { top: 12px; left: 0; height: 2px; width: 8px; }
  #hitmarker i:nth-child(4) { top: 12px; right: 0; height: 2px; width: 8px; }

  /* Overlay */
  .overlay {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 24px;
    background: color-mix(in srgb, var(--canvas) 86%, transparent);
    z-index: 50;
  }
  .overlay[hidden] { display: none; }
  .panel {
    width: min(440px, 100%);
    padding: 32px;
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: var(--radius-panel);
  }
  .panel h1 { margin: 0 0 8px; font-size: 28px; font-weight: 600; letter-spacing: -0.02em; }
  .panel p { margin: 0 0 20px; font-size: 15px; line-height: 1.5; color: var(--muted); }
  #play {
    font: inherit;
    font-weight: 500;
    padding: 12px 18px;
    border: 1px solid var(--accent);
    border-radius: var(--radius-control);
    background: var(--accent);
    color: var(--canvas);
    cursor: pointer;
    transition: background-color 120ms ease;
  }
  #play:hover { background: var(--ink); border-color: var(--ink); }

  .keys {
    margin: 20px 0 0;
    padding: 0;
    list-style: none;
    display: grid;
    gap: 6px;
    font-size: 13px;
    color: var(--muted);
  }
  .keys li { display: flex; align-items: center; gap: 8px; }
  .keys kbd {
    min-width: 24px;
    padding: 2px 6px;
    border: 1px solid var(--hairline);
    border-radius: var(--radius-panel);
    font-family: var(--font-readout);
    font-size: 11px;
    color: var(--ink);
    text-align: center;
  }
</style>
</head>
<body>
<div id="game"></div>

<div id="hud" aria-hidden="true">
  <div id="crosshair"><i></i><i></i><i></i><i></i></div>
  <div id="hitmarker"><i></i><i></i><i></i><i></i></div>
  <div id="ammo"><span id="ammo-mag">30</span><span id="ammo-reserve">/ 90</span></div>
</div>

<div id="overlay" class="overlay">
  <section class="panel" role="dialog" aria-modal="true" aria-labelledby="overlay-title">
    <h1 id="overlay-title">Depot 7 Tactical FPS</h1>
    <p id="overlay-copy">Round-based tactical shooter. Eliminate enemy bots or secure Bomb Site Alpha. Click to deploy.</p>
    <button id="play" type="button">Deploy (Click to play)</button>
    <ul class="keys">
      <li><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> Move | <kbd>Shift</kbd> Sprint</li>
      <li><kbd>Mouse</kbd> Aim & Shoot</li>
      <li><kbd>1</kbd><kbd>2</kbd> Switch Weapon | <kbd>R</kbd> Reload</li>
      <li><kbd>G</kbd> Throw HE Grenade</li>
      <li><kbd>E</kbd> Defuse / Plant Bomb</li>
      <li><kbd>B</kbd> Tactical Buy Menu</li>
      <li><kbd>Ctrl</kbd> Crouch</li>
    </ul>
  </section>
</div>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.min.js"
  }
}
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
